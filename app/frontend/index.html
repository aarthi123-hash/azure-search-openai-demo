<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    
    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Viewport and responsive settings -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#be4c29" />
    
    <!-- SEO and Meta tags -->
    <title>GAIA</title>
    <meta name="description" content="Advanced AI-powered search and chat interface using Azure OpenAI services" />
    <meta name="keywords" content="AI, OpenAI, Azure, Search, Chat, Machine Learning" />
    <meta name="author" content="Your Company Name" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourcompany.com/" />
    <meta property="og:title" content="Azure OpenAI + AI Search | Your Company" />
    <meta property="og:description" content="Advanced AI-powered search and chat interface" />
    <meta property="og:image" content="/og-image.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://yourcompany.com/" />
    <meta property="twitter:title" content="Azure OpenAI + AI Search | Your Company" />
    <meta property="twitter:description" content="Advanced AI-powered search and chat interface" />
    <meta property="twitter:image" content="/og-image.png" />
    
    <!-- Preload critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Google Fonts for better typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    
    <!-- Base styles and CSS variables -->
    <style>
        :root {
            /* Company Color Palette */
            --color-primary: #be4c29;
            --color-secondary: #54504f;
            --color-accent: #e6e4e3;
            --color-neutral-light: #988e8b;
            --color-neutral: #838483;
            --color-dark: #2c2b2c;
            --color-background: #ffffff; /* White background */
            
            /* Typography */
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-family-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
            
            /* Spacing */
            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --spacing-2xl: 3rem;
            
            /* Border radius */
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            
            /* Shadows */
            --shadow-sm: 0 2px 4px rgba(44, 43, 44, 0.1);
            --shadow-md: 0 4px 12px rgba(44, 43, 44, 0.15);
            --shadow-lg: 0 8px 24px rgba(44, 43, 44, 0.2);
            --shadow-xl: 0 16px 48px rgba(44, 43, 44, 0.25);
        }
        
        * {
            box-sizing: border-box;
        }
        
        html {
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            background: var(--color-background); /* Changed to white background */
            color: var(--color-dark);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Loading state */
        #root {
            min-height: 100vh;
            position: relative;
        }
        
        /* Loading spinner */
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-background); /* Changed to white background */
            z-index: 9999;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--color-accent);
            border-top: 4px solid var(--color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .loading-text {
            margin-top: var(--spacing-md);
            color: var(--color-secondary);
            font-weight: 500;
            text-align: center;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Hide loading when React app loads */
        #root:not(:empty) + .loading-container {
            display: none;
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--color-accent);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--color-neutral-light);
            border-radius: var(--radius-sm);
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-primary);
        }
        
        /* Focus styles for accessibility */
        :focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }
        
        /* Additional styles for uniform box heights and input positioning */
        /* These may need to be adjusted based on your actual component structure */
        .question-input-container {
            position: fixed;
            bottom: 120px; /* Raised higher from bottom */
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            z-index: 100;
        }
        
        .content-boxes, .result-boxes, .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }
        
        .content-box, .result-box, .card {
            flex: 1;
            min-height: 200px; /* Uniform minimum height */
            display: flex;
            flex-direction: column;
            border: 1px solid var(--color-accent);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            background: white;
            box-shadow: var(--shadow-sm);
        }
        
        .content-box > *, .result-box > *, .card > * {
            flex-grow: 1;
        }
        
        /* Print styles */
        @media print {
            body {
                background: white !important;
                color: black !important;
            }
        }
        
        /* Reduced motion for accessibility */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <!-- Main React App Container -->
    <div id="root"></div>
    
    <!-- Loading fallback (shown while React loads) -->
    <div class="loading-container">
        <div>
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading AI Assistant...</div>
        </div>
    </div>
    
    <!-- React App Script -->
    <script type="module" src="/src/index.tsx"></script>
    
    <!-- Service Worker Registration (optional) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('SW registered: ', registration);
                    })
                    .catch((registrationError) => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
</body>
</html>
